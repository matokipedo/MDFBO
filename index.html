<script>
/* Appearance: follows the system (Auto), or Light / Dark. Warm tint is an optional Night-Shift-style filter. Runs before paint to avoid a flash. */
(function () {
  var P = 'mdfbo_', r = document.documentElement, mq = matchMedia('(prefers-color-scheme: light)');
  function get(k) { try { return localStorage.getItem(P + k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(P + k, v); } catch (e) {} }
  function resolved() { var t = get('theme'); return t === 'light' || t === 'dark' ? t : (mq.matches ? 'light' : 'dark'); }
  function apply() {
    var t = get('theme'); if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
    if (get('warm') === 'on') r.setAttribute('data-warm', ''); else r.removeAttribute('data-warm');
    var c = resolved() === 'light' ? '#f4f2ea' : '#0f1512', m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', c);
    var lbl = { auto: 'Auto', light: 'Light', dark: 'Dark' };
    document.querySelectorAll('[data-theme-btn]').forEach(function (b) { b.setAttribute('aria-label', 'Appearance: ' + lbl[t === 'light' || t === 'dark' ? t : 'auto'] + '. Activate to change.'); });
    document.querySelectorAll('[data-warm-btn]').forEach(function (b) { b.setAttribute('aria-checked', get('warm') === 'on' ? 'true' : 'false'); });
  }
  apply();
  mq.addEventListener && mq.addEventListener('change', apply);
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-theme-btn],[data-warm-btn]'); if (!b) return;
    if (b.hasAttribute('data-theme-btn')) { var t = get('theme'); set('theme', t === 'light' ? 'dark' : t === 'dark' ? 'auto' : 'light'); }
    else set('warm', get('warm') === 'on' ? 'off' : 'on');
    apply();
  });
  document.addEventListener('DOMContentLoaded', function () { apply(); new MutationObserver(function () { apply(); }).observe(document.body, { childList: true, subtree: true }); });
})();
</script>

<script>
(() => {
'use strict';
const cfg = window.MDFBO_CONFIG || {};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Number(n || 0).toLocaleString();
const pct = (a, b) => b ? Math.round(100 * a / b) : null;
const fmtDate = iso => iso ? new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const ago = iso => { if (!iso) return 'never'; const s = (Date.now() - new Date(iso)) / 1000; if (s < 90) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 172800) return Math.floor(s / 3600) + ' h ago'; return Math.floor(s / 86400) + ' d ago'; };
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500); }
const plain = m => {
  m = String(m || '');
  if (/provider is not enabled|Unsupported provider/i.test(m)) return "This sign-in option isn't switched on in Supabase yet; SIGNIN.md has the steps.";
  if (/Signups not allowed/i.test(m)) return 'New sign-ups are switched off. Ask the owner to add you.';
  if (/Manual linking is disabled/i.test(m)) return 'Turn on "Allow manual linking" in Supabase → Authentication → Sign In / Providers.';
  if (/NotAllowedError|AbortError/i.test(m)) return 'The passkey prompt was closed. Nothing changed.';
  if (/JWT expired|invalid JWT/i.test(m)) return 'Your sign-in expired. Sign out and sign in again.';
  return m;
};
const msg = e => plain((e && (e.message || e.error_description)) || String(e || 'Something went wrong'));
const app = $('#app');

const MODULES = { m1: '1 Preparing for planting', m2: '2 Planting correctly', m3: '3 Early crop management', m4: '4 Crop protection', m5: '5 Harvesting & marketing' };
const STEPS = { introduce: '1 Introduce', explain: '2 Explain', demonstrate: '3 Demonstrate', practice: '4 Practice', check: '5 Check', reinforce: '6 Reinforce', plot: 'Demo plot' };

if (!cfg.supabaseUrl || !cfg.supabaseKey) {
  app.innerHTML = `<div class="login"><div class="card"><h2>Not connected yet</h2><p class="muted">Open <code>config.js</code> and paste the Supabase project URL and the <b>publishable (anon)</b> key. Never paste the service_role key here.</p></div><footer class="vfoot">MDF back office v${(document.querySelector('meta[name=app-version]') || {}).content || ''}</footer></div>`;
  return;
}
let sb;
const S = { user: null, role: null, tab: 'overview', days: null, sessions: [], feedback: [], plots: [], farmers: [], dealers: [], media: [], last: {}, mf: { plot: '', module: '', review: '' } };
const canEdit = () => S.role === 'editor' || S.role === 'owner';
const sampleTag = r => r && r.is_sample ? ' <span class="pill sample">sample</span>' : '';

/* ---------- boot ---------- */
async function boot() {
  if (!window.supabase) await new Promise(r => { const t = setInterval(() => { if (window.supabase) { clearInterval(t); r(); } }, 50); setTimeout(() => { clearInterval(t); r(); }, 6000); });
  if (!window.supabase) { app.innerHTML = `<div class="login"><div class="card err">Could not load the Supabase library. Check your connection and reload.</div><footer class="vfoot">MDF back office v${esc(version())}</footer></div>`; return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { storageKey: 'mdfbo_auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, experimental: { passkey: cfg.passkeys !== false } } });
  const hp = new URLSearchParams(location.hash.slice(1) + '&' + location.search.slice(1)); S.recovery = hp.get('type') === 'recovery'; if (hp.get('error_description')) S.note = 'Sign-in failed: ' + hp.get('error_description').replace(/\+/g, ' ');
  const { data } = await sb.auth.getSession();
  S.user = data.session ? data.session.user : null;
  if (hp.get('access_token') || hp.get('error_description') || hp.get('code')) history.replaceState(null, '', location.pathname);
  sb.auth.onAuthStateChange((e, s) => { const u = s ? s.user : null; if (e === 'PASSWORD_RECOVERY') { S.recovery = true; S.user = u; renderSetPassword(); return; } if (S.recovery) return; if ((u && u.id) !== (S.user && S.user.id)) { S.user = u; start(); } });
  start();
}
async function start() {
  if (S.recovery && S.user) return renderSetPassword();
  if (!S.user) { const n = S.note; S.note = ''; return renderLogin(n); }
  const { data, error } = await sb.rpc('my_role');
  S.role = !error && data ? data : null;
  if (!S.role) return renderNoAccess(error);
  renderShell(); app.querySelector('#main').innerHTML = '<div class="skel" style="height:120px"></div><div class="skel" style="height:220px;margin-top:14px"></div>';
  await loadAll(); renderTab();
}

const authRedirect = () => location.origin + location.pathname;
async function oauthGo(provider, link) {
  try {
    const opts = { redirectTo: authRedirect(), skipBrowserRedirect: true };
    const { data, error } = link ? await sb.auth.linkIdentity({ provider, options: opts }) : await sb.auth.signInWithOAuth({ provider, options: opts });
    if (error) return msg(error);
    const url = data && data.url; if (!url) return 'No sign-in address came back.';
    try { const r = await fetch(url, { redirect: 'manual' }); if (r.status >= 400 && r.status < 500) { const j = await r.json().catch(() => ({})); return plain(j.msg || j.error_description || 'provider is not enabled'); } } catch (e) { /* cross-origin redirect is expected */ }
    location.assign(url); return '';
  } catch (e) { return msg(e); }
}

/* ---------- Insight kit: every analytics page is built from these five pieces ----------
   window row -> Key metrics tiles (value + change vs previous period + sparkline) -> Highlights -> sections -> ranked lists -> grey note. */
const WINDOWS = [[7, '7 days'], [30, '30 days'], [90, '90 days'], [365, '1 year'], [0, 'Season (lifetime)']];
const insWindow = (days, id = 'insr') => `<div class="row sp"><span>${days === 0 ? '<span class="life">Lifetime</span>' : ''}</span>
    <div class="row"><label class="muted" for="${id}">Window</label><select id="${id}" class="f" style="width:auto">${WINDOWS.map(([v, l]) => `<option value="${v}" ${v === days ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>`;
function sparkBars(vals, label) {
  if (!vals || !vals.length) return '';
  const MAX = 48, step = Math.ceil(vals.length / MAX), b = [];
  for (let i = 0; i < vals.length; i += step) b.push(vals.slice(i, i + step).reduce((a, c) => a + c, 0));
  const top = Math.max(1, ...b), w = 100 / b.length;
  return `<svg viewBox="0 0 100 46" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${b.map((v, i) => { const h = v ? Math.max(2, v / top * 44) : 0; return h ? `<rect x="${(i * w + w * .15).toFixed(2)}" y="${(46 - h).toFixed(2)}" width="${(w * .7).toFixed(2)}" height="${h.toFixed(2)}" rx=".6"/>` : ''; }).join('')}</svg>`;
}
function drChg(t, p, life, unit = '%') {
  if (life || t === null || p === null) return ''; t = Number(t || 0); p = Number(p || 0);
  if (unit === 'pt') { const d = Math.round(t - p); return `<span class="chg ${d > 0 ? 'up' : d < 0 ? 'dn' : ''}">${d > 0 ? '▲ ' : d < 0 ? '▼ ' : ''}${Math.abs(d)} ${Math.abs(d) === 1 ? 'pt' : 'pts'}</span>`; }
  if (!p && !t) return '<span class="chg">0%</span>'; if (!p) return '<span class="chg up">New</span>';
  const x = (t - p) / p * 100; if (Math.round(Math.abs(x)) === 0) return '<span class="chg">0%</span>'; return `<span class="chg ${x >= 0 ? 'up' : 'dn'}">${x >= 0 ? '▲' : '▼'} ${Math.abs(x).toFixed(0)}%</span>`;
}
/* one tile. go = tab to open on click (optional); chg = drChg(...) html; ser = per-day numbers */
const insTile = ({ l, v, chg = '', ser = null, go = '' }) => `<${go ? 'button' : 'div'} class="kt"${go ? ` data-m="${go}" title="Open ${esc(l)} in Trends"` : ''}><span class="l">${esc(l)}</span><b>${v === null || v === undefined ? '–' : v}</b>${chg ? `<span class="row" style="gap:6px;margin:0 0 4px">${chg}</span>` : ''}${ser ? sparkBars(ser, l + ' per day') : ''}</${go ? 'button' : 'div'}>`;
const insTodo = (l, d) => `<div class="kt na"><span class="l">${esc(l)}</span><b>–</b><span class="d">${esc(d)}</span></div>`;

/* the window as [start, end) plus the previous window of the same length; lifetime = everything */
function win(days) {
  const now = Date.now(), d = 864e5;
  if (!days) { const first = Math.min(now, ...S.sessions.map(r => +new Date(r.created_at))); const n = Math.max(1, Math.ceil((now - first) / d) + 1); return { from: now - n * d, to: now + 1, pfrom: 0, pto: 0, n, life: true }; }
  return { from: now - days * d, to: now + 1, pfrom: now - 2 * days * d, pto: now - days * d, n: days, life: false };
}
const inWin = (rows, a, b) => rows.filter(r => { const t = +new Date(r.created_at); return t >= a && t < b; });
function daily(rows, w, f) { const out = new Array(w.n).fill(0); rows.forEach(r => { const i = Math.floor((+new Date(r.created_at) - w.from) / 864e5); if (i >= 0 && i < w.n) out[i] += f(r); }); return out; }
function dailyDistinct(rows, w) { const out = Array.from({ length: w.n }, () => new Set()); rows.forEach(r => { const i = Math.floor((+new Date(r.created_at) - w.from) / 864e5); if (i >= 0 && i < w.n) out[i].add(r.device_id); }); return out.map(x => x.size); }
const sum = (rows, k) => rows.reduce((a, r) => a + (+r[k] || 0), 0);

  const plots = withPlots ? S.plots.filter(p => p.lat != null && p.lon != null).map(p => { const [x, y] = mozXY(+p.lat, +p.lon); return `<rect class="plot" x="${(x - 4).toFixed(1)}" y="${(y - 4).toFixed(1)}" width="8" height="8" rx="2"><title>Demo plot: ${esc(p.crop)} ${esc(p.variety || '')} (${esc(p.status)})</title></rect>`; }).join('') : '';

}

const csvCell = v => { let s = v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v)); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function downloadCSV(name, rows) {
  if (!rows.length) return toast('Nothing to export in this window.');
  const cols = Object.keys(rows[0]); const csv = [cols.join(',')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(','))).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = `mdf-${name}-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`Exported ${rows.length} rows.`);
}

      return `<tr><td>${esc(lfName(p.lead_farmer_id))}${sampleTag(p)}</td><td>${esc(p.crop)} ${esc(p.variety || '')}</td><td>${esc(p.planting_date || '—')}</td><td class="num">${wk ?? '—'}</td><td>${pill(p.status)}</td><td>${p.lat != null ? `<a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${+p.lat}&mlon=${+p.lon}#map=15/${+p.lat}/${+p.lon}">OSM</a>` : '—'}</td><td class="num">${p.final_yield_kg_ha ?? '—'}</td></tr>`; }).join(''),
    'No plots yet.')}
  <p class="muted" style="font-size:12px">Stage-by-stage observations: technicians collect them offline with the KoboToolbox form (SETUP.md step 6). Photos from lead farmers show up under Photos &amp; videos.</p>`;
  $('#csv').onclick = () => downloadCSV('demo_plots', S.plots);
  const f = $('#pf'); if (!f) return;
  $('#gps').onclick = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => { $('#p_lat').value = p.coords.latitude.toFixed(5); $('#p_lon').value = p.coords.longitude.toFixed(5); }, e => toast(e.message)) : toast('This browser has no GPS.');
  f.onsubmit = async e => { e.preventDefault(); const v = id => $('#' + id).value.trim() || null, n = id => v(id) === null ? null : +v(id);
    const { error } = await sb.from('demo_plots').insert({ lead_farmer_id: v('p_lf'), crop: v('p_crop'), variety: v('p_var'), planting_date: v('p_date'), lat: n('p_lat'), lon: n('p_lon'), status: v('p_status') });
    if (error) return toast(msg(error)); toast('Plot saved.'); await load('plots'); tabPlots(); };
}

/* ---------- questions ---------- */
function tabQuestions() {
  const order = { open: 0, escalated: 1, answered: 2 };
  const list = [...S.feedback].sort((a, b) => order[a.status] - order[b.status] || new Date(b.created_at) - new Date(a.created_at));
  const pill = s => `<span class="pill ${s === 'answered' ? 'ok' : s === 'open' ? 'warn' : 'bad'}">${esc(s === 'escalated' ? 'with content team' : s)}</span>`;
  $('#main').innerHTML = `<h2>Questions from lead farmers</h2>
  ${tableCard('<th>Question</th><th>Status</th><th></th>', list.map(r => `<tr><td><span class="muted">${esc([r.village, r.district].filter(Boolean).join(', ') || 'Unknown place')} · ${esc(r.kind)} · ${ago(r.created_at)}</span>${sampleTag(r)}<div style="overflow-wrap:anywhere">${esc(r.message)}</div>${r.answer ? `<div class="muted">↳ ${esc(r.answer)}</div>` : ''}</td><td>${pill(r.status)}</td>
    <td class="row" style="flex-wrap:nowrap">${canEdit() && r.status !== 'answered' ? `<button class="btn sec sm" data-ans="${r.id}">Answer</button>${r.status === 'open' ? `<button class="btn sec sm" data-esc="${r.id}">To content team</button>` : ''}` : ''}</td></tr>`).join(''), 'No questions yet.')}
  <p class="muted" style="font-size:12px">Answers are saved here. Send them back to the lead farmer on WhatsApp too: the kit has no inbox yet.</p>`;
  $('#main').onclick = async e => { const b = e.target.closest('[data-ans],[data-esc]'); if (!b) return;
    let patch;
    if (b.dataset.ans) { const r = S.feedback.find(x => String(x.id) === b.dataset.ans); const a = await ask('Answer', r ? r.message : '', r && r.answer || ''); if (!a) return; patch = [b.dataset.ans, { answer: a, status: 'answered', answered_at: new Date().toISOString() }]; }
    else patch = [b.dataset.esc, { status: 'escalated' }];
    b.disabled = true; const { error } = await sb.from('feedback').update(patch[1]).eq('id', patch[0]);
    if (error) { b.disabled = false; return toast(msg(error)); }
    const r = S.feedback.find(x => String(x.id) === patch[0]); if (r) Object.assign(r, patch[1]); toast('Saved.'); renderNav(); tabQuestions(); };
}

/* ---------- photos & videos ---------- */
async function tabMedia() {
  const rows = S.media, f = S.mf;
  const plots = [...new Set(rows.map(r => r.plot_code || '—'))].sort();
  const shown = rows.filter(r => (!f.plot || (r.plot_code || '—') === f.plot) && (!f.module || (r.module_id || 'plot') === f.module) && (!f.review || r.review === f.review));
  const sel = (k, opts) => `<select class="f" data-mf="${k}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === f[k] ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  $('#main').innerHTML = `<h2>Photos &amp; videos from the field</h2>
  <div class="form" style="margin-bottom:6px">
    <div><label class="l">Demo plot</label>${sel('plot', [['', 'All plots'], ...plots.map(p => [p, p])])}</div>
    <div><label class="l">Module</label>${sel('module', [['', 'All'], ...Object.entries(MODULES), ['plot', 'Demo plot']])}</div>
    <div><label class="l">Review</label>${sel('review', [['', 'All'], ['new', 'New'], ['good', 'Good'], ['needs_help', 'Needs help'], ['hidden', 'Hidden']])}</div></div>
  <p class="muted" style="font-size:12px">${shown.length} of ${rows.length} items${shown.length > 200 ? ' (first 200 shown)' : ''}. Links expire after 1 hour; reopen the tab to refresh.</p><div id="mbody"><div class="skel" style="height:180px"></div></div>`;
  $('#main').querySelectorAll('[data-mf]').forEach(s => s.onchange = () => { f[s.dataset.mf] = s.value; tabMedia(); });
  const urls = {}, paths = shown.slice(0, 200).map(r => r.storage_path);
  if (paths.length) { const { data, error } = await sb.storage.from('step-media').createSignedUrls(paths, 3600); if (error) toast(msg(error)); (data || []).forEach(d => { if (d.signedUrl) urls[d.path] = d.signedUrl; }); }
  if (S.tab !== 'media' || !$('#mbody')) return;
  const groups = {}; shown.slice(0, 200).forEach(r => { const g = `${r.plot_code || 'No plot code'} · ${MODULES[r.module_id] || 'Demo plot'} · ${STEPS[r.step_id] || r.step_id}`; (groups[g] ||= []).push(r); });
  const rp = s => `<span class="pill ${s === 'good' ? 'ok' : s === 'needs_help' ? 'bad' : s === 'new' ? 'warn' : ''}">${esc(s.replace('_', ' '))}</span>`;
  const card = r => { const u = urls[r.storage_path];
    const media = !u ? '<div class="mm none">not loaded</div>' : r.kind === 'video' ? `<video class="mm" controls preload="metadata" src="${esc(u)}"></video>` : `<a href="${esc(u)}" target="_blank" rel="noopener"><img class="mm" src="${esc(u)}" alt="${esc(r.caption || '')}" loading="lazy"></a>`;
    return `<div class="mcard">${media}<div style="font-size:13px;margin-top:6px"><b>${esc(r.lead_farmer || '—')}</b> · ${esc(r.village || '')}${sampleTag(r)}<br><span class="muted">${esc(fmtDate(r.taken_at || r.created_at))} · ${Math.round(r.bytes / 1024)} KB</span> ${rp(r.review)}${r.caption ? `<div>${esc(r.caption)}</div>` : ''}${r.reviewer_note ? `<div class="muted">↳ ${esc(r.reviewer_note)}</div>` : ''}</div>
      ${canEdit() ? `<div class="row" style="gap:4px;margin-top:6px"><button class="btn sec sm" data-rv="good" data-id="${r.id}">✓ Good</button><button class="btn sec sm" data-rv="needs_help" data-id="${r.id}">Needs help</button><button class="btn sec sm" data-rv="hidden" data-id="${r.id}">Hide</button></div>` : ''}</div>`; };
  $('#mbody').innerHTML = Object.entries(groups).map(([g, items]) => `<div class="sec" style="margin:18px 0 8px;font-weight:700">${esc(g)} <span class="muted" style="font-weight:400">(${items.length})</span></div><div class="mgrid">${items.map(card).join('')}</div>`).join('') || '<div class="card"><p class="muted" style="margin:0">No photos or videos yet. They arrive when lead farmers add them in a lesson and have signal.</p></div>';
  $('#mbody').onclick = async e => { const b = e.target.closest('[data-rv]'); if (!b) return;
    const note = b.dataset.rv === 'needs_help' ? await ask('What should the lead farmer fix?', 'Saved here. Send it on WhatsApp too.') : null;
    if (b.dataset.rv === 'needs_help' && note === null) return;
    const { error } = await sb.from('step_media').update({ review: b.dataset.rv, reviewer_note: note }).eq('id', b.dataset.id); if (error) return toast(msg(error));
    const r = S.media.find(x => String(x.id) === b.dataset.id); if (r) Object.assign(r, { review: b.dataset.rv, reviewer_note: note }); renderNav(); tabMedia(); };
}

/* ---------- partners & people ---------- */
function tabPeople() {
  const dName = id => (S.dealers.find(d => d.id === id) || {}).name || '—';
  const season = s => s === 1 ? 'New' : s === 2 ? '2nd season' : '3rd+ (graduating)';
  const support = s => s === 1 ? 'Kits, plot instructions, calendar' : s === 2 ? '+ monitoring, regular audio/video, feedback' : 'Runs content, calendar and monitoring with less PROMAS support';
  const trained = {}; S.sessions.forEach(r => { if (r.lead_farmer) trained[r.lead_farmer] = (trained[r.lead_farmer] || 0) + r.farmers_present; });
  $('#main').innerHTML = `<h2>Partners &amp; people</h2>
  <div class="sec" style="font-weight:700;margin:6px 0 8px">Agrodealers <span class="muted" style="font-weight:400">${S.dealers.length}</span></div>
  ${tableCard('<th>Name</th><th>District</th><th>Partnership</th><th>Digital support level</th>', S.dealers.map(d => `<tr><td>${esc(d.name)}${sampleTag(d)}</td><td>${esc(d.district || '')}</td><td>${season(d.partnership_season)}</td><td class="muted">${support(d.partnership_season)}</td></tr>`).join(''), 'No agrodealers yet.')}
  ${canEdit() ? `<form class="card" id="df"><h3>Add an agrodealer</h3><div class="form"><div><label class="l" for="d_name">Name</label><input class="f" id="d_name" required></div><div><label class="l" for="d_district">District</label><input class="f" id="d_district"></div><div><label class="l" for="d_season">Partnership season</label><select class="f" id="d_season"><option>1</option><option>2</option><option>3</option></select></div></div><button class="btn" style="margin-top:12px" type="submit">Add agrodealer</button></form>` : ''}
  <div class="sec" style="font-weight:700;margin:22px 0 8px">Lead farmers <span class="muted" style="font-weight:400">${S.farmers.length}</span></div>
  ${tableCard('<th>Name</th><th>Sex</th><th>Village / district</th><th>Agrodealer</th><th class="num">Farmers trained</th><th>Phone</th>', S.farmers.map(l => `<tr><td>${esc(l.name)}${sampleTag(l)}</td><td>${esc(l.sex || '')}</td><td>${esc([l.village, l.district].filter(Boolean).join(', '))}</td><td>${esc(dName(l.agrodealer_id))}</td><td class="num">${nf(trained[l.name] || 0)}</td><td>${l.phone ? `<a href="https://wa.me/${esc(l.phone.replace(/\D/g, ''))}" target="_blank" rel="noopener">${esc(l.phone)}</a>` : ''}</td></tr>`).join(''), 'No lead farmers yet.')}
  ${canEdit() ? `<form class="card" id="lff"><h3>Add a lead farmer</h3><div class="form"><div><label class="l" for="l_name">Name</label><input class="f" id="l_name" required></div><div><label class="l" for="l_sex">Sex</label><select class="f" id="l_sex"><option value="">—</option><option value="f">F</option><option value="m">M</option></select></div><div><label class="l" for="l_village">Village</label><input class="f" id="l_village"></div><div><label class="l" for="l_district">District</label><input class="f" id="l_district"></div><div><label class="l" for="l_phone">Phone (WhatsApp)</label><input class="f" id="l_phone" inputmode="tel"></div><div><label class="l" for="l_dealer">Agrodealer</label><select class="f" id="l_dealer"><option value="">—</option>${S.dealers.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div></div><button class="btn" style="margin-top:12px" type="submit">Add lead farmer</button></form>` : ''}
  <p class="muted" style="font-size:12px">“Farmers trained” matches the name a lead farmer types in the kit, so keep names spelled the same in both places.</p>`;
  const v = id => $('#' + id).value.trim() || null;
  const df = $('#df'); if (df) df.onsubmit = async e => { e.preventDefault(); const { error } = await sb.from('agrodealers').insert({ name: v('d_name'), district: v('d_district'), partnership_season: +v('d_season') || 1 }); if (error) return toast(msg(error)); toast('Agrodealer added.'); await load('dealers'); tabPeople(); };
  const lf = $('#lff'); if (lf) lf.onsubmit = async e => { e.preventDefault(); const { error } = await sb.from('lead_farmers').insert({ name: v('l_name'), sex: v('l_sex'), village: v('l_village'), district: v('l_district'), phone: v('l_phone'), agrodealer_id: v('l_dealer') }); if (error) return toast(msg(error)); toast('Lead farmer added.'); await load('farmers'); tabPeople(); };
}

/* ---------- settings ---------- */
function tabSettings() {
  const owner = S.role === 'owner';
  $('#main').innerHTML = `<h2>Settings</h2>
  <div class="card" id="team"><h3>Team</h3><p class="muted">Loading…</p></div>
  <div class="card" id="sec"><h3>Sign-in methods</h3><p class="muted">Loading…</p></div>
  <form class="card" id="cp"><h3>Change password</h3><div class="row"><input class="f" id="np" type="password" autocomplete="new-password" minlength="8" placeholder="New password (8+ characters)" style="flex:1;min-width:200px" required><button class="btn" type="submit">Update</button></div></form>
  <div class="card"><h3>Appearance</h3><p class="muted" style="margin:0">The round button cycles Light → Dark → Auto (Auto follows your device). Warm adds an amber layer for night work. Both are saved in this browser.</p></div>
  <div class="card"><h3>Safety checklist</h3><ul class="muted" style="margin:0;padding-left:18px"><li>This page uses only the publishable key. Never put the service_role key in any file.</li><li>After the owner account exists, turn OFF “Allow new users to sign up” in Supabase → Authentication → Sign In / Providers.</li><li>Viewers can read everything; editors can also answer, review and add; only the owner can change the team.</li><li>Field photos stay in a private bucket and open through links that expire after 1 hour.</li></ul></div>`;
  $('#cp').onsubmit = async e => { e.preventDefault(); const { error } = await sb.auth.updateUser({ password: $('#np').value }); if (error) toast(msg(error)); else { toast('Password updated.'); $('#np').value = ''; } };
  renderTeam(owner); renderSecurity();
}
async function renderTeam(owner) {
  const box = $('#team'); const { data, error } = await sb.rpc('admin_team'); if (!$('#team')) return;
  const missing = error && /admin_team|admin_grant|schema cache|does not exist|PGRST202/i.test(error.message || '');
  box.innerHTML = `<h3>Team</h3>${missing ? '<p class="muted">One step left: open <b>supabase/migrations/20261127000000_team_by_email.sql</b>, paste its contents into the Supabase SQL editor and press Run. Then reload this tab.</p>' : error ? `<p class="err">${esc(msg(error))}</p>` :
    (data || []).map(m => `<div class="idrow"><b>${esc(m.email)}</b><span class="pill ${m.role === 'owner' ? 'ok' : ''}">${esc(m.role)}</span><span class="muted">since ${esc(new Date(m.since).toLocaleDateString())}</span></div>`).join('')}
  ${owner && !missing ? `<form id="af" style="margin-top:12px"><p class="muted" style="margin:0 0 8px">They create an account on the sign-in page first; then enter the same email here.</p><div class="row"><input class="f" id="ae" type="email" placeholder="email@example.org" style="flex:1;min-width:200px" required><select class="f" id="ar" style="width:auto"><option value="editor">Editor</option><option value="viewer">Viewer</option><option value="owner">Owner</option></select><button class="btn" type="submit">Add to team</button></div></form>` : owner ? '' : '<p class="muted" style="margin:8px 0 0">Only the owner can add people.</p>'}`;
  const af = $('#af'); if (af) af.onsubmit = async e => { e.preventDefault(); const { data: r, error: er } = await sb.rpc('admin_grant', { p_email: $('#ae').value.trim(), p_role: $('#ar').value });
    if (er) return toast(msg(er)); if (r === 'no_account') return toast('No account with that email yet. Ask them to press Create account first.'); toast('Added as ' + r + '.'); renderTeam(owner); };
}
async function renderSecurity() {
  const box = $('#sec'); if (!box) return;
  const ids = await sb.auth.getUserIdentities().then(r => (r.data && r.data.identities) || []).catch(() => []);
  let pks = []; try { const r = await sb.auth.passkey.list(); const d = r.data; pks = Array.isArray(d) ? d : (d && d.passkeys) || []; } catch (e) { pks = null; }
  if (!$('#sec')) return;
  const have = new Set(ids.map(i => i.provider === 'custom:yahoo' || i.provider === 'yahoo' ? 'custom:yahoo' : i.provider));
  box.innerHTML = `<h3>Sign-in methods</h3><p class="muted" style="margin-top:0">Link more ways into this same account. Your email and password keep working.</p>
  ${ids.map(i => `<div class="idrow"><b>${esc(i.provider === 'email' ? 'Email and password' : provName(i.provider))}</b><span class="muted">${esc((i.identity_data && i.identity_data.email) || '')}</span>${ids.length > 1 ? `<button class="btn bad sm" data-unlink="${esc(i.identity_id)}" type="button">Unlink</button>` : ''}</div>`).join('') || '<p class="muted">No linked methods found.</p>'}
  <div class="sso" style="margin-top:10px">${PROVIDERS.filter(p => !have.has(p[0])).map(p => `<button class="btn sec" type="button" data-link="${p[0]}">${p[2]}Link ${p[1]}</button>`).join('')}</div>
  <h3 style="margin-top:16px">Passkeys</h3>
  ${pks === null ? '<p class="muted">Passkeys are not available on this project yet (enable them in Supabase → Authentication → Passkeys).</p>' : (pks.map(k => `<div class="idrow"><b>${esc(k.friendly_name || 'Passkey')}</b><span class="muted">${k.last_used_at ? 'used ' + esc(new Date(k.last_used_at).toLocaleDateString()) : 'not used yet'}</span><button class="btn sec sm" data-pkr="${esc(k.id)}" type="button">Rename</button><button class="btn bad sm" data-pkd="${esc(k.id)}" type="button">Delete</button></div>`).join('') || '<p class="muted">No passkeys yet.</p>') + '<div class="row" style="margin-top:8px"><button class="btn" id="pkadd" type="button">Add a passkey on this device</button></div>'}
  <p class="err" id="sec-n"></p>`;
  const note = t => { $('#sec-n').textContent = t || ''; };
  box.onclick = async e => { const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.link) { const m = await oauthGo(b.dataset.link, true); if (m) note(m + ' (Linking also needs “Allow manual linking” on in Supabase → Authentication → Sign In / Providers.)'); }
      else if (b.dataset.unlink) { if (!confirm('Unlink this sign-in method?')) return; const id = ids.find(i => i.identity_id === b.dataset.unlink); const { error } = await sb.auth.unlinkIdentity(id); if (error) note(msg(error)); else renderSecurity(); }
      else if (b.id === 'pkadd') { const { error } = await sb.auth.registerPasskey(); if (error) note(msg(error)); else { toast('Passkey added.'); renderSecurity(); } }
      else if (b.dataset.pkd) { if (!confirm('Delete this passkey?')) return; const { error } = await sb.auth.passkey.delete({ passkeyId: b.dataset.pkd }); if (error) note(msg(error)); else renderSecurity(); }
      else if (b.dataset.pkr) { const n = await ask('Name this passkey', 'For example “Lichinga laptop”.'); if (!n) return; const { error } = await sb.auth.passkey.update({ passkeyId: b.dataset.pkr, friendlyName: n.slice(0, 60) }); if (error) note(msg(error)); else renderSecurity(); }
    } catch (er) { note(plain(er.name || er.message)); } };
}

boot();
})();
</script>
</body>
</html>
